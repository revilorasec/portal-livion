<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de Bônus de Reparabilidade</title><style>body{margin:0;background:#f4f7fb;color:#16233a;font:15px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1060px;margin:auto;padding:30px}h1{margin:0;font-size:26px}p{color:#5a6880}.card{background:white;border:1px solid #dfe6ef;border-radius:13px;padding:22px;margin:18px 0;box-shadow:0 2px 8px #15223b0a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{font-weight:650;display:grid;gap:6px}input{border:1px solid #b9c6d8;border-radius:7px;padding:10px;font:inherit}button{background:#1565c0;color:#fff;border:0;border-radius:7px;padding:11px 15px;font-weight:700;cursor:pointer}button.secondary{background:#e6edf7;color:#17345d}table{border-collapse:collapse;width:100%}th,td{padding:9px;border-bottom:1px solid #e4e9f0;text-align:left}#message{min-height:21px;color:#a63c20}.result{font-size:22px;font-weight:750;color:#0a6b55}.hidden{display:none}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style><body><main><h1>Calculadora de Bônus de Reparabilidade</h1><p>Competência por devolução efetiva: peças com a fórmula <code>=HOJE()</code> na data de devolução não entram no cálculo.</p><div id="message"></div><section class="card"><h2>Simular bônus mensal</h2><div class="grid"><label>Colaborador<input id="name" maxlength="120" placeholder="Nome completo"></label><label>Competência<input id="period" type="month"></label><label>Peças reparadas<input id="repaired" type="number" min="0" value="0"></label><label>Peças irreparáveis<input id="irreparable" type="number" min="0" value="0"></label></div><p><button id="simulate">Salvar simulação</button></p><div id="result" class="result"></div></section><section id="rulesCard" class="card hidden"><h2>Regras vigentes</h2><p id="rules"></p></section><section id="historyCard" class="card hidden"><h2>Histórico</h2><table><thead><tr><th>Colaborador</th><th>Competência</th><th>Reparabilidade</th><th>Bônus</th><th>Status</th></tr></thead><tbody id="history"></tbody></table></section></main><script>const API='https://kvfjjtkwxxbvzlicwnrz.supabase.co/functions/v1/bonus-reparabilidade-api';const $=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const pct=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';function token(){return window.parent!==window?window.parent.__PORTAL_TOKEN__:window.__PORTAL_TOKEN__}async function api(method,body){const t=token();if(!t)throw Error('Abra este aplicativo pelo Portal Livion.');const r=await fetch(API,{method,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.message||'Não foi possível concluir a operação.');return d}function displayRule(r){const x=r.payload||r;const ranges=x.ranges.map((a,i)=>`${i===0?'0':(x.ranges[i-1].max+1)}–${a.max??'acima'}: ${money(a.standard)} / ${money(a.high)}`).join(' · ');$('rules').textContent=`70% a 79,99%: valor padrão. A partir de 80%: valor alto. ${ranges}`;$('rulesCard').classList.remove('hidden')}function row(c){const p=c.payload||{};return `<tr><td>${c.employee_name}</td><td>${String(c.period).slice(0,7)}</td><td>${pct(p.repairability)}</td><td>${money(p.total)}</td><td>${c.status}</td></tr>`}async function load(){try{const d=await api('GET');displayRule(d.rules);if(d.calculations?.length){$('history').innerHTML=d.calculations.map(row).join('');$('historyCard').classList.remove('hidden')}}catch(e){$('message').textContent=e.message}}$('simulate').onclick=async()=>{try{$('message').textContent='';const name=$('name').value.trim(),period=$('period').value,repaired=+$('repaired').value,irreparable=+$('irreparable').value;const d=await api('POST',{type:'simulate',employeeName:name,employeeKey:name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase(),period,repaired,irreparable});const p=d.calculation.payload;$('result').textContent=`Reparabilidade: ${pct(p.repairability)} · Valor por peça: ${money(p.rate)} · Bônus: ${money(p.total)}`;load()}catch(e){$('message').textContent=e.message}};load();</script></body></html>
