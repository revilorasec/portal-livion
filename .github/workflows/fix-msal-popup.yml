name: Fix MSAL popup callback
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-msal-popup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prevent Portal bootstrap inside MSAL popup callback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='async function init(){\n try{msalApp=new msal.PublicClientApplication'
          new="async function init(){\n if(window.opener && window.opener!==window){document.documentElement.style.visibility='hidden';return}\n try{msalApp=new msal.PublicClientApplication"
          if old not in s:
              raise SystemExit('init anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "window.opener && window.opener!==window" index.html
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: prevent nested MSAL auth inside consent popup'
          git push
