name: Inventory UI verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify inventory UI
        run: node --test tests/inventory-v17.test.mjs tests/inventory-v18.test.mjs tests/inventory-product-media.test.mjs
