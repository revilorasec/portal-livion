name: Add PWA install buttons

on:
  push:
    paths:
      - '.github/workflows/pwa-install-buttons.yml'
      - 'scripts/add_pwa_install_buttons.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PWA install patch
        run: python3 scripts/add_pwa_install_buttons.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: add Portal and per-app install buttons"
            git push
          fi
