name: Enable Portal admin v3
on:
  push:
    paths:
      - '.github/workflows/enable-admin-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable v3 admin UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="./portal-admin-v2.js?v=1"></script>'
          new=old+'\n<script src="./portal-admin-v3.js?v=1"></script>'
          if 'portal-admin-v3.js' not in s:
              if old not in s: raise SystemExit('anchor not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: enable simplified admin v3"
          git push
