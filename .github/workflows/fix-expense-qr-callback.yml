name: Fix Expenses QR callback

on:
  push:
    paths:
      - '.github/workflows/fix-expense-qr-callback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply QR callback fix
        run: python3 tools/fix_expense_qr_callback.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add despesas-reembolsos-v2.js despesas-reembolsos-v2.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: corrige preenchimento apos leitura do QR fiscal"
            git push
          fi
