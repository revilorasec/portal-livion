name: Disable photo OCR v21
on:
  push:
    paths:
      - tools/disable_photo_ocr_v21.py
      - .github/workflows/disable-photo-ocr-v21.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python tools/disable_photo_ocr_v21.py
      - run: node --check despesas-reembolsos-v2.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add despesas-reembolsos-v2.js despesas-reembolsos-v2.html
          git diff --cached --quiet || git commit -m "fix: deixa fotos sem OCR e entrada manual"
          git push
