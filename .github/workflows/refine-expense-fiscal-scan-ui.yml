name: Refine Expense Fiscal Scan UI
on:
  push:
    paths:
      - 'tools/refine_expense_fiscal_scan_ui.py'
      - '.github/workflows/refine-expense-fiscal-scan-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/refine_expense_fiscal_scan_ui.py
      - run: |
          grep -q 'fiscalSummary' despesas-reembolsos-v2.html
          grep -q 'formatDocument' despesas-reembolsos-v2.js
          grep -q 'despesas-reembolsos-v2.js?v=6' despesas-reembolsos-v2.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add despesas-reembolsos-v2.html despesas-reembolsos-v2.js
          git diff --cached --quiet || git commit -m "feat: compacta dados fiscais e padroniza documentos"
          git push
