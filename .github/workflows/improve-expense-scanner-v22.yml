name: Improve expense scanner v22
on:
  push:
    paths:
      - 'tools/patch_expenses_scanner_v22.py'
      - '.github/workflows/improve-expense-scanner-v22.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scanner improvements
        run: python tools/patch_expenses_scanner_v22.py
      - name: Validate JavaScript
        run: node --check despesas-reembolsos-v2.js
      - name: Validate diff
        run: git diff --check
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add despesas-reembolsos-v2.js despesas-reembolsos-v2.html
          git commit -m 'feat: match expense scanner to Racha Viagem flow'
          git push
