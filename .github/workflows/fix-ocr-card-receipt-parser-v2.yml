name: Fix OCR card receipt parser v2
on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_ocr_card_receipt_parser_v2.py'
      - '.github/workflows/fix-ocr-card-receipt-parser-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python tools/fix_ocr_card_receipt_parser_v2.py
      - run: node --check despesas-reembolsos-v2.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add despesas-reembolsos-v2.js despesas-reembolsos-v2.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: melhora OCR de comprovantes de cartao"
          git push
