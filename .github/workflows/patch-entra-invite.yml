name: Patch Entra guest invitation automation

on:
  workflow_dispatch:
  push:
    paths:
      - '.build/entra-users-block.txt'
      - '.github/workflows/patch-entra-invite.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Portal external-user flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<button data-tab="companies">Empresas</button>','<button data-tab="companies">Empresas e clientes</button>')
          if "GRAPH_INVITE_SCOPE" not in s:
              s=s.replace("const REDIRECT=new URL('./',window.location.href).href;","const REDIRECT=new URL('./',window.location.href).href;\nconst GRAPH_INVITE_SCOPE='User.Invite.All';")
          old_icon="'reparos-claro':`<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14.7 6.3a4 4 0 0 0-5 5L4 17l3 3 5.7-5.7a4 4 0 0 0 5-5l-2.4 2.4-3-3z\"></path><path d=\"M5.5 15.5l3 3\"></path></svg>`"
          new_icon="'reparos-claro':`<img src=\"./assets/claro-logo.png\" alt=\"Claro\" style=\"width:34px;height:34px;object-fit:contain\">`"
          s=s.replace(old_icon,new_icon)
          start=s.index('function formData(){')
          end=s.index('function renderProfiles()',start)
          block=Path('.build/entra-users-block.txt').read_text(encoding='utf-8')
          s=s[:start]+block+s[end:]
          old="function renderCompanies(){$('tabContent').innerHTML=`<section class=\"section\"><h2>Empresas</h2><p class=\"help\">Catálogo usado nas permissões do Portal.</p><div class=\"company-grid\">${catalog.companies.map(c=>`<article class=\"mini\"><b>${c.label}</b><p>Código: ${c.key}</p></article>`).join('')}</div></section>`}"
          new="function renderCompanies(){$('tabContent').innerHTML=`<section class=\"section\"><h2>Empresas internas</h2><p class=\"help\">Empresas usadas pelos usuários internos.</p><div class=\"company-grid\">${catalog.companies.map(c=>`<article class=\"mini\"><b>${c.label}</b><p>Código: ${c.key}</p></article>`).join('')}</div></section><section class=\"section\"><h2>Clientes</h2><p class=\"help\">Clientes/escopos usados nos aplicativos externos.</p><div class=\"company-grid\">${(catalog.clients||[]).map(c=>`<article class=\"mini\"><b>${c.label}</b><p>Código: ${c.key}</p></article>`).join('')}</div></section>`}"
          s=s.replace(old,new)
          s=s.replace("r.action==='USER_DELETE'?'Usuário excluído':r.action","r.action==='USER_DELETE'?'Usuário excluído':r.action==='ENTRA_INVITE_STATUS'?'Status de convite Entra':r.action")
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "User.Invite.All" index.html
          grep -q "Reenviar convite" index.html
          grep -q "Empresas internas" index.html
          grep -q "catalog.clients" index.html
      - name: Commit Portal automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: automate Entra guest invitations and separate client scopes'
            git push
          fi
