name: Unified Portal app bar
on:
  push:
    paths:
      - '.github/workflows/unified-appbar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Portal workspace navigation
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div id="workspace" class="workspace hidden"><div class="workspace-bar"><button id="closeWorkspace" class="btn">← Voltar</button><b id="workspaceTitle"></b><span class="grow"></span><button id="openExternal" class="btn">Abrir em nova guia</button></div><iframe id="workspaceFrame" title="Aplicativo Livion"></iframe></div>'
          new='''<div id="workspace" class="workspace hidden"><div class="workspace-bar"><button id="workspaceHome" class="workspace-brand" title="Portal Livion" aria-label="Portal Livion"></button><nav id="workspaceApps" class="workspace-apps" aria-label="Aplicativos liberados"></nav><span class="grow"></span><button id="openExternal" class="btn workspace-external">Abrir em nova guia</button></div><iframe id="workspaceFrame" title="Aplicativo Livion"></iframe></div>'''
          if old not in s:
              raise SystemExit('workspace markup anchor not found')
          s=s.replace(old,new,1)

          anchor="async function openApp(a){try{ctx=await api('/context');if(!ctx.apps.includes(a.key))throw new Error('FORBIDDEN');currentApp=a;$('workspaceTitle').textContent=a.title;$('openExternal').classList.toggle('hidden',a.key==='reparos-claro');const frame=$('workspaceFrame');"
          repl="""function allowedRegistry(){const fallback=[{key:'rh',title:'Recursos Humanos',href:'https://revilorasec.github.io/rh-livion/?v=1.8.2'},{key:'fretes',title:'Transportadora',href:'https://revilorasec.github.io/fretes-livion/?v=1.3.5'}];const r=(Array.isArray(ctx?.appCatalog)&&ctx.appCatalog.length?ctx.appCatalog:fallback);return r.filter(a=>ctx?.apps?.includes(a.key))}\nfunction renderWorkspaceApps(){const nav=$('workspaceApps');if(!nav)return;const apps=allowedRegistry();nav.innerHTML=apps.map(a=>`<button class=\"workspace-app ${currentApp?.key===a.key?'active':''}\" data-ws-app=\"${a.key}\" title=\"${esc(a.title)}\"><span class=\"workspace-app-icon\">${appIcon(a.key)}</span><span class=\"workspace-app-name\">${esc(a.title)}</span></button>`).join('');nav.querySelectorAll('[data-ws-app]').forEach(b=>b.onclick=()=>{const a=apps.find(x=>x.key===b.dataset.wsApp);if(a&&a.key!==currentApp?.key)openApp(a)})}\nasync function openApp(a){try{ctx=await api('/context');if(!ctx.apps.includes(a.key))throw new Error('FORBIDDEN');currentApp=a;renderWorkspaceApps();$('openExternal').classList.toggle('hidden',a.key==='reparos-claro');const frame=$('workspaceFrame');"""
          if anchor not in s:
              raise SystemExit('openApp anchor not found')
          s=s.replace(anchor,repl,1)

          old2="$('closeWorkspace').onclick=()=>{$('workspace').classList.add('hidden');$('workspaceFrame').src='about:blank'};$('openExternal').onclick=()=>currentApp&&window.open(currentApp.href,'_blank','noopener');"
          new2="$('workspaceHome').onclick=()=>{$('workspace').classList.add('hidden');$('workspaceFrame').src='about:blank';currentApp=null;$('settingsView').classList.add('hidden');$('home').classList.remove('hidden')};$('openExternal').onclick=()=>currentApp&&window.open(currentApp.href,'_blank','noopener');"
          if old2 not in s:
              raise SystemExit('closeWorkspace anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        run: |
          grep -q 'id="workspaceApps"' index.html
          grep -q 'function renderWorkspaceApps' index.html
          grep -q 'id="workspaceHome"' index.html
          ! grep -q 'id="closeWorkspace"' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: unified Portal app switcher"
          git push