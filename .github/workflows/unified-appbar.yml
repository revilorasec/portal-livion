name: Unified Portal app bar
on:
  push:
    paths:
      - '.github/workflows/unified-appbar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure unified navigation assets are linked
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./unified-nav.css?v=1" />'
          if css not in s:
              anchor='<link rel="stylesheet" href="./portal-theme.css?v=3" />'
              if anchor not in s: raise SystemExit('theme link anchor not found')
              s=s.replace(anchor,anchor+'\n'+css,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        run: |
          grep -q 'unified-nav.css' index.html
          grep -q 'id="workspaceApps"' index.html
          grep -q 'function renderWorkspaceApps' index.html
          grep -q 'id="workspaceHome"' index.html
          ! grep -q 'id="closeWorkspace"' index.html
      - name: Commit if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: enable unified Portal navigation styles"
          git push