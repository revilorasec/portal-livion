name: Optimize live QR scanner
on:
  push:
    branches: [main]
    paths:
      - 'tools/optimize_live_qr_scanner.py'
      - '.github/workflows/optimize-live-qr-scanner.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python tools/optimize_live_qr_scanner.py
      - run: node --check despesas-reembolsos-v2.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add despesas-reembolsos-v2.html despesas-reembolsos-v2.js
          git diff --cached --quiet || git commit -m "feat: acelera leitura de QR Code"
          git push
