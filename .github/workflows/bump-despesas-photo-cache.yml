name: Bump despesas photo helper cache
on:
  push:
    paths:
      - '.github/workflows/bump-despesas-photo-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump helper version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('despesas-reembolsos-v2.html')
          s=p.read_text(encoding='utf-8')
          old='./despesas-photos-v1.js?v=4'
          new='./despesas-photos-v1.js?v=5'
          if old not in s:
              raise SystemExit('expected helper reference not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'Livion Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add despesas-reembolsos-v2.html
          git commit -m 'fix: refresh expense photo gallery and delete controls'
          git push
