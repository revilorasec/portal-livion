name: Patch expense photo gallery UX
on:
  push:
    paths:
      - '.github/workflows/patch-expense-photo-gallery.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable gallery and bump photo helper
        shell: python
        run: |
          from pathlib import Path
          p = Path('despesas-reembolsos-v2.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('id="ePhoto1" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"', 'id="ePhoto1" type="file" accept="image/*"')
          s = s.replace('id="ePhoto2" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"', 'id="ePhoto2" type="file" accept="image/*"')
          s = s.replace('./despesas-photos-v1.js?v=1', './despesas-photos-v1.js?v=2')
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add despesas-reembolsos-v2.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: enable gallery and existing photo removal UX"
          git push
