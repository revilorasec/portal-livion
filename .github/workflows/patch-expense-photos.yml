name: Patch expense photos
on:
  push:
    paths:
      - '.github/workflows/patch-expense-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject photo patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('despesas-reembolsos-v2.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="./despesas-photos-v1.js?v=1"></script>'
          if marker not in s:
              s=s.replace('</body></html>', marker+'</body></html>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add despesas-reembolsos-v2.html
          git commit -m 'feat: enable gallery selection and deleting expense photos'
          git push
