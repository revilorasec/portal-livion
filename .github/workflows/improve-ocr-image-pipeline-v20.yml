name: Improve OCR image pipeline v20
on:
  push:
    paths:
      - tools/improve_ocr_image_pipeline_v20.py
      - .github/workflows/improve-ocr-image-pipeline-v20.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python tools/improve_ocr_image_pipeline_v20.py
      - run: node --check despesas-reembolsos-v2.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add despesas-reembolsos-v2.js despesas-reembolsos-v2.html
          git diff --cached --quiet || git commit -m "fix: melhora leitura OCR de comprovantes"
          git push
