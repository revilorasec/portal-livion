name: Improve Expense Receipt OCR

on:
  push:
    paths:
      - '.github/workflows/improve-expense-receipt-ocr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply OCR improvements
        run: python tools/improve_expense_receipt_ocr.py
      - name: Verify patch
        run: |
          grep -q 'receiptCanvas' despesas-reembolsos-v2.js
          grep -q 'mergeFiscalReads' despesas-reembolsos-v2.js
          grep -q 'OCR 1/2' despesas-reembolsos-v2.js
          grep -q 'v=5' despesas-reembolsos-v2.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add despesas-reembolsos-v2.js despesas-reembolsos-v2.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: improve receipt OCR accuracy'
          git push
