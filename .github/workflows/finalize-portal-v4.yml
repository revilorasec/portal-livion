name: Finalize Portal v4

on:
  push:
    paths:
      - '.build/claro2.part*'
      - '.github/workflows/finalize-portal-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild exact original Status Reparos Claro HTML
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .build/claro2.part1 \
            .build/claro2.part2 \
            .build/claro2.part3 \
            .build/claro2.part4 \
            .build/claro2.part5 \
            .build/claro2.part6 \
            .build/claro2.part7a \
            .build/claro2.part7b \
            | base64 -d | xz -d > cliente-claro.html

          test -s cliente-claro.html
          grep -q 'Portal de Acompanhamento Claro' cliente-claro.html
          grep -q 'Visão executiva' cliente-claro.html
          grep -q 'SLA & fluxo' cliente-claro.html
          grep -q 'Regiões, UFs e CDs' cliente-claro.html
          grep -q 'Famílias & tecnologias' cliente-claro.html
          grep -q 'LPU comercial' cliente-claro.html
          grep -q 'Movimentações' cliente-claro.html
          grep -q 'Base operacional' cliente-claro.html
          grep -q 'Jornada dos equipamentos' cliente-claro.html

          echo "Original Claro HTML rebuilt successfully: $(wc -c < cliente-claro.html) bytes"

      - name: Commit exact original app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cliente-claro.html
          if git diff --cached --quiet; then
            echo 'No app change to commit'
          else
            git commit -m 'feat: restore exact original Status Reparos Claro interface'
            git push
          fi
