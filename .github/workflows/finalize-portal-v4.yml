name: Finalize Portal v4

on:
  push:
    paths:
      - '.build/status-reparos.part1a'
      - '.build/status-reparos.part2'
      - '.github/workflows/finalize-portal-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild original Status Reparos Claro HTML
        shell: bash
        run: |
          set -euo pipefail
          cat .build/status-reparos.part1a .build/status-reparos.part2 | base64 -d | xz -d > cliente-claro.html
          test -s cliente-claro.html
          grep -q 'Portal de Acompanhamento Claro' cliente-claro.html
          grep -q 'Visão executiva' cliente-claro.html
          grep -q 'SLA & fluxo' cliente-claro.html
          grep -q 'LPU comercial' cliente-claro.html
      - name: Commit published changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cliente-claro.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: restore original Status Reparos Claro HTML'
            git push
          fi
