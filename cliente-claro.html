<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acompanhamento de Reparos | Livion Solutions</title>
<style>
:root{--navy:#123f78;--blue:#214f8f;--yellow:#f4c400;--bg:#f4f7fb;--card:#fff;--text:#14213d;--muted:#6d7c91;--line:#e2e8f0;--ok:#13734b;--warn:#9a6700;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#f8faff,#f3f6fa);color:var(--text)}button,input,select{font:inherit}.wrap{max-width:1500px;margin:0 auto;padding:24px}.head{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--blue)}h1{margin:4px 0 5px;font-size:30px;letter-spacing:-.025em}.muted{color:var(--muted)}.live{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8}.dot.ok{background:#16a36a;box-shadow:0 0 0 4px rgba(22,163,106,.11)}.dot.bad{background:#d92d20}.toolbar{display:grid;grid-template-columns:minmax(260px,1.5fr) repeat(3,minmax(150px,.6fr)) auto auto;gap:10px;margin:16px 0}.toolbar input,.toolbar select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.btn{padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);cursor:pointer}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.kpis{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:12px;margin-bottom:16px}.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 8px 24px rgba(31,67,111,.055)}.kpi small{display:block;color:var(--muted);font-weight:650}.kpi b{display:block;font-size:27px;margin-top:5px;letter-spacing:-.03em}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px rgba(31,67,111,.06);overflow:hidden}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line)}.card-head h2{font-size:17px;margin:0}.table-wrap{overflow:auto;max-height:calc(100vh - 350px)}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}th,td{padding:10px 11px;border-bottom:1px solid #edf1f5;border-right:1px solid #f2f4f7;text-align:left;white-space:nowrap;vertical-align:top}th{position:sticky;top:0;background:#f8fafc;z-index:2;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#58677b;cursor:pointer}tr:hover td{background:#fbfdff}.empty{padding:38px;text-align:center;color:var(--muted)}.status{padding:3px 8px;border-radius:999px;background:#eef4fb;color:var(--blue);font-size:11px}.error{background:#fff1f0;color:var(--bad);border:1px solid #ffd7d2;padding:12px 14px;border-radius:11px;margin-bottom:14px}.hidden{display:none!important}.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}.pager .actions{display:flex;gap:8px}@media(max-width:1000px){.toolbar{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.wrap{padding:14px}.head{display:block}.toolbar{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.table-wrap{max-height:none}}
</style>
</head>
<body>
<div class="wrap">
 <div class="head"><div><div class="eyebrow">Área do cliente · Claro</div><h1>Acompanhamento de Reparos</h1><div class="muted">Dados operacionais atualizados diretamente da base liberada para o cliente.</div></div><div><div class="live"><span id="dot" class="dot"></span><span id="liveText">Conectando...</span></div><div id="lastUpdate" class="muted" style="font-size:12px;margin-top:5px"></div></div></div>
 <div id="error" class="error hidden"></div>
 <div class="kpis"><div class="kpi"><small>Registros</small><b id="kTotal">-</b></div><div class="kpi"><small>Na Livion</small><b id="kLivion">-</b></div><div class="kpi"><small>Reparados</small><b id="kRepaired">-</b></div><div class="kpi"><small>Em trânsito</small><b id="kTransit">-</b></div><div class="kpi"><small>Entregues à Claro</small><b id="kDelivered">-</b></div></div>
 <div class="toolbar"><input id="search" placeholder="Buscar ID, NF, serial, part number, regional, status..."><select id="status"><option value="">Todos os status</option></select><select id="regional"><option value="">Todas as regionais</option></select><select id="where"><option value="">Todas as localizações</option></select><button id="refresh" class="btn primary">Atualizar</button><button id="export" class="btn">Exportar CSV</button></div>
 <div class="card"><div class="card-head"><h2>Base operacional</h2><span id="count" class="status">0 registros</span></div><div class="table-wrap"><table id="table"></table><div id="empty" class="empty hidden">Nenhum registro encontrado.</div></div><div class="pager"><span id="pageInfo" class="muted"></span><div class="actions"><button id="prev" class="btn">Anterior</button><button id="next" class="btn">Próxima</button></div></div></div>
</div>
<script>
const API='https://kvfjjtkwxxbvzlicwnrz.supabase.co/functions/v1/client-repairs-api';
const AUTO_REFRESH_MS=60000,PAGE_SIZE=100;
let DATA=[],FILTERED=[],COLUMNS=[],page=1,sort={key:'ID',dir:'asc'},timer=null;
const $=id=>document.getElementById(id), txt=v=>v==null?'':String(v).trim(), norm=v=>txt(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function token(){try{return window.parent&&window.parent!==window?String(window.parent.__PORTAL_TOKEN__||''):''}catch{return ''}}
function esc(v){return txt(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return new Intl.NumberFormat('pt-BR').format(Number(n)||0)}
function isRepaired(r){return /reparad|reparo conclu|03-reparado/i.test(txt(r.Status))}
function isTransit(r){return /transit|a caminho/i.test(txt(r.Status)+' '+txt(r['Onde está']))}
function isDelivered(r){return !!txt(r['Data Entrega na Claro'])||norm(r['Onde está'])==='claro'}
function setState(ok,msg){$('dot').className='dot '+(ok?'ok':'bad');$('liveText').textContent=msg}
function unique(key){return [...new Set(DATA.map(r=>txt(r[key])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function fillSelect(id,key,label){const el=$(id),cur=el.value;el.innerHTML=`<option value="">${label}</option>`+unique(key).map(v=>`<option>${esc(v)}</option>`).join('');el.value=cur}
function buildColumns(rows){const preferred=['ID','Tipo de reparo','Urgência','Onde está','SLA Claro','Dias na Livion','Nota Fiscal Claro','Data Emisão Nota fiscal','Centro','REGIONAL','UF - REGIONAL','CD','CD ou EA','Data recebimento na Livion','Part. Number','Nº de Série','Descrição','IW','CÓD. SAP','BP/SGP/NS (Nº EQUIPAMENTO)','Família','Part. Number Devolvido','Nº de Série Devolvido','Fabricante da unidade','Status','Detalhe do Status','Data Expedição','Caixa','Nota fiscal retorno','Data nota fiscal de retorno','Data Entrega na Claro','Valor Reparo'];const all=[];rows.slice(0,500).forEach(r=>Object.keys(r||{}).forEach(k=>{if(!k.startsWith('_')&&!all.includes(k))all.push(k)}));COLUMNS=[...preferred.filter(k=>all.includes(k)),...all.filter(k=>!preferred.includes(k))]}
function apply(){const q=norm($('search').value),st=$('status').value,rg=$('regional').value,wh=$('where').value;FILTERED=DATA.filter(r=>(!st||txt(r.Status)===st)&&(!rg||txt(r.REGIONAL)===rg)&&(!wh||txt(r['Onde está'])===wh)&&(!q||COLUMNS.some(c=>norm(r[c]).includes(q))));FILTERED.sort((a,b)=>{let x=a[sort.key],y=b[sort.key];let nx=Number(x),ny=Number(y),cmp;if(txt(x)!==''&&txt(y)!==''&&!Number.isNaN(nx)&&!Number.isNaN(ny))cmp=nx-ny;else cmp=txt(x).localeCompare(txt(y),'pt-BR',{numeric:true,sensitivity:'base'});return sort.dir==='asc'?cmp:-cmp});page=1;render()}
function renderKpis(){const rows=FILTERED;$('kTotal').textContent=fmt(rows.length);$('kLivion').textContent=fmt(rows.filter(r=>norm(r['Onde está'])==='livion').length);$('kRepaired').textContent=fmt(rows.filter(isRepaired).length);$('kTransit').textContent=fmt(rows.filter(isTransit).length);$('kDelivered').textContent=fmt(rows.filter(isDelivered).length)}
function render(){renderKpis();const pages=Math.max(1,Math.ceil(FILTERED.length/PAGE_SIZE));if(page>pages)page=pages;const start=(page-1)*PAGE_SIZE,rows=FILTERED.slice(start,start+PAGE_SIZE);$('count').textContent=fmt(FILTERED.length)+' registros';$('pageInfo').textContent=`Página ${page} de ${pages} · exibindo ${rows.length} de ${FILTERED.length}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('empty').classList.toggle('hidden',rows.length>0);$('table').innerHTML=rows.length?`<thead><tr>${COLUMNS.map(c=>`<th data-col="${esc(c)}">${esc(c)}${sort.key===c?(sort.dir==='asc'?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${COLUMNS.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody>`:'';document.querySelectorAll('th[data-col]').forEach(th=>th.onclick=()=>{const k=th.dataset.col;sort={key:k,dir:sort.key===k&&sort.dir==='asc'?'desc':'asc'};render()})}
async function refresh(manual=false){const t=token();if(!t){setState(false,'Acesso pelo Portal obrigatório');$('error').textContent='Abra este aplicativo pelo Portal Livion autenticado.';$('error').classList.remove('hidden');return}if(manual)$('refresh').disabled=true;try{setState(true,'Atualizando...');const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);const r=await fetch(API+'?client=claro&_='+Date.now(),{cache:'no-store',signal:ctl.signal,headers:{Authorization:'Bearer '+t}});clearTimeout(to);const p=await r.json();if(!r.ok||p.error)throw new Error(p.error||('HTTP '+r.status));const rows=Array.isArray(p)?p:(p.rows||p.data||[]);if(!Array.isArray(rows))throw new Error('Resposta sem linhas');DATA=rows.filter(r=>r&&txt(r.ID));buildColumns(DATA);fillSelect('status','Status','Todos os status');fillSelect('regional','REGIONAL','Todas as regionais');fillSelect('where','Onde está','Todas as localizações');$('error').classList.add('hidden');setState(true,'Tempo real ativo');const d=p.updatedAt||p.generatedAt;$('lastUpdate').textContent='Atualizado em '+(d?new Date(d).toLocaleString('pt-BR'):new Date().toLocaleString('pt-BR'));apply()}catch(e){setState(false,'Falha na atualização');$('error').textContent='Não foi possível atualizar os dados agora. '+(e?.message||e);$('error').classList.remove('hidden')}finally{$('refresh').disabled=false}}
function exportCSV(){const rows=FILTERED;if(!rows.length)return;const q=v=>'"'+txt(v).replace(/"/g,'""')+'"';const csv='\ufeff'+COLUMNS.map(q).join(';')+'\n'+rows.map(r=>COLUMNS.map(c=>q(r[c])).join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Portal_Claro_Dados_Filtrados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
['search'].forEach(id=>$(id).addEventListener('input',apply));['status','regional','where'].forEach(id=>$(id).addEventListener('change',apply));$('refresh').onclick=()=>refresh(true);$('export').onclick=exportCSV;$('prev').onclick=()=>{if(page>1){page--;render()}};$('next').onclick=()=>{if(page*PAGE_SIZE<FILTERED.length){page++;render()}};refresh();timer=setInterval(refresh,AUTO_REFRESH_MS);
</script>
</body>
</html>
